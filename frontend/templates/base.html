{%- from "_macros.html" import enlace -%}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Economista IA{% endblock %}</title>
  <link rel="icon" href="/static/ilustraciones/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/estilo.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<div id="pagina" class="pagina tono-{% block tono %}menta{% endblock %}">
  <header class="barra">
    {% call enlace("/", "marca") %}Economista IA{% endcall %}
    <div class="barra-derecha">
      <span class="estado" hx-get="/estado-modelo" hx-trigger="load" hx-swap="innerHTML"></span>
      <button type="button" class="chip-empresa" hx-get="/empresa" hx-target="#dialogo-empresa .cuerpo"
              hx-on::after-request="document.getElementById('dialogo-empresa').showModal()"
              aria-haspopup="dialog">
        <span class="chip-nombre">{{ empresa }}</span>
        <span class="chip-accion">Cambiar empresa</span>
      </button>
    </div>
  </header>

  <main id="contenido">{% block contenido %}{% endblock %}</main>

  <dialog id="dialogo-empresa" class="dialogo" aria-labelledby="titulo-empresa">
    <div class="dialogo-cabeza">
      <h2 id="titulo-empresa">Empresa</h2>
      <button type="button" class="cerrar" aria-label="Cerrar"
              onclick="this.closest('dialog').close()">×</button>
    </div>
    <div class="cuerpo"></div>
  </dialog>
</div>
</body>
</html>
