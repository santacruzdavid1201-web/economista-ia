# Definiciones que recibe el LLM para explicar los indicadores. El modelo local
# definió "razón corriente" como "creencias compartidas por una sociedad"
# cuando respondió de memoria: las definiciones salen de aquí, no del modelo.
# Lenguaje para un gerente que no es financiero; una o dos frases.

razon_corriente: >-
  Cuántos pesos de activos de corto plazo (caja, cartera, inventarios) tiene la
  empresa por cada peso de deudas que vencen en el próximo año.
prueba_acida: >-
  Igual que la razón corriente, pero sin contar los inventarios, que son lo más
  difícil de convertir en efectivo.
razon_efectivo: >-
  Cuántos pesos de efectivo e inversiones de corto plazo hay por cada peso de
  deudas de corto plazo.
capital_trabajo: >-
  Diferencia entre los activos y las deudas de corto plazo. Si es negativa, las
  deudas que vencen en el año superan los recursos de corto plazo.
nivel_endeudamiento: >-
  Qué parte de los activos está financiada con deudas (bancos, proveedores,
  empleados, impuestos, etc.).
concentracion_cp: Qué parte de la deuda total vence en el próximo año.
apalancamiento: >-
  Cuántos pesos de deuda hay por cada peso que han aportado o dejado los socios
  (patrimonio).
deuda_ebitda: >-
  Cuántos años de EBITDA (la caja que genera la operación) se necesitarían para
  pagar la deuda con bancos.
cobertura_intereses: Cuántas veces la utilidad operacional alcanza para pagar los intereses.
carga_financiera: Qué parte de las ventas se va en gastos financieros (intereses y comisiones).
margen_bruto: Qué parte de cada peso vendido queda después del costo directo de lo vendido.
margen_operacional: >-
  Qué parte de cada peso vendido queda después de los costos y gastos de la
  operación, antes de intereses e impuestos.
ebitda: >-
  Utilidad operacional antes de descontar depreciaciones y amortizaciones, en
  pesos: aproxima la caja que genera la operación en el periodo. No es un margen.
margen_ebitda: >-
  Como el margen operacional, pero sin descontar depreciaciones y
  amortizaciones: aproxima la caja que genera la operación por cada peso vendido.
margen_neto: >-
  Qué parte de cada peso vendido queda como utilidad final, después de
  intereses e impuestos.
roa: Utilidad neta del año por cada peso de activos (rentabilidad del activo).
roe: >-
  Utilidad neta del año por cada peso de patrimonio, es decir, de lo que han
  aportado o dejado los socios (rentabilidad del patrimonio).
rotacion_activos: Cuántos pesos vende la empresa en el año por cada peso de activos.
multiplicador_capital: >-
  Cuántos pesos de activos hay por cada peso de patrimonio; en el análisis
  DuPont mide cuánto se apoya la rentabilidad en la deuda.
dias_cartera: Cuántos días tardan en promedio los clientes en pagar.
dias_inventario: Cuántos días dura en promedio el inventario antes de venderse.
dias_proveedores: Cuántos días tarda en promedio la empresa en pagarle a sus proveedores.
ciclo_conversion_efectivo: >-
  Días entre el pago a los proveedores y el cobro a los clientes. Si es alto, la
  empresa tiene que financiar ese tiempo con su caja o con deuda.
em_score: >-
  Puntaje Z'' de Altman: combina liquidez, utilidades acumuladas, rentabilidad
  operativa y solvencia en una señal de alerta temprana de dificultades
  financieras. No es una probabilidad de quiebra.
# Sin cifras en las definiciones: toda cifra de los datos queda "permitida"
# para el verificador de la redacción.
percentil: >-
  Posición frente a las empresas del sector: indica qué porcentaje de ellas
  tiene un valor menor que el de la empresa.
crecimiento_nominal_ingresos: >-
  Cuánto subieron los ingresos en pesos, sin descontar que los precios también
  subieron.
inflacion_promedio: >-
  Cuánto subió el nivel de precios promedio del año frente al promedio del año
  anterior, según el IPC (de la ciudad de la empresa si existe; si no, el
  nacional).
crecimiento_real_ingresos: >-
  Cuánto crecieron los ingresos después de descontar la inflación general
  (IPC): si es positivo, subieron más que los precios al consumidor; si es
  negativo, subieron menos. No mide la cantidad vendida.
ingresos_anteriores_a_precios_actuales: >-
  Los ingresos del año anterior expresados en pesos de hoy: con ellos se
  comparan los ingresos actuales sin el efecto de la inflación.
tasa_implicita_deuda: >-
  Lo que en promedio le costó la deuda a la empresa en el año: gastos
  financieros divididos entre la deuda financiera promedio. Es aproximada,
  porque los gastos financieros incluyen comisiones además de intereses.
intereses_por_punto: >-
  Cuánto suben los gastos financieros en un año si la tasa de la deuda sube un
  punto porcentual. Un punto es una diferencia entre tasas (de doce a trece por
  ciento), no subir la tasa un uno por ciento.
mayor_alza_ibr_12m: >-
  La mayor subida de la IBR a tres meses en un año desde que existe la serie.
  Es un dato del pasado, no una predicción.
tasa_politica: >-
  Tasa que fija la junta del Banco de la República para controlar la inflación.
  No es la tasa que paga la empresa, pero las tasas de los créditos la siguen
  con algún rezago.
ibr_3m: >-
  Indicador Bancario de Referencia a tres meses: tasa de referencia del mercado
  interbancario. Muchos créditos a tasa variable se pactan como IBR más un
  margen.
inflacion_anual: >-
  Cuánto subieron los precios al consumidor en los últimos doce meses (IPC del
  mes frente al del mismo mes del año anterior).
trm: >-
  Tasa Representativa del Mercado: cuántos pesos cuesta un dólar, según la
  Superintendencia Financiera. Si sube, el peso pierde valor frente al dólar.
variacion_anual_trm: Cuánto cambió el precio del dólar en pesos frente a un año antes.
crecimiento_pib: >-
  Cuánto creció la producción de la economía colombiana (PIB real) frente al
  mismo trimestre del año anterior.
desempleo: >-
  Qué parte de las personas que buscan trabajo no lo consiguen. Se compara con
  el mismo mes del año anterior porque la serie no corrige la estacionalidad.
tasa_efectiva_anual: >-
  Lo que de verdad cuesta el crédito en un año, contando el interés que se
  cobra sobre los intereses. Es la tasa que deben informar los bancos en
  Colombia y la que sirve para comparar créditos.
tasa_periodica: >-
  La tasa que se cobra en cada cuota (cada mes, trimestre o semestre). Es
  equivalente a la efectiva anual, pero no es la efectiva anual dividida entre
  el número de cuotas del año.
cuota: >-
  Lo que se paga en cada periodo con el sistema de cuota fija. Es igual en
  todas las cuotas: al principio casi todo es interés y al final casi todo es
  abono a la deuda.
abono_capital: >-
  En el sistema de abono constante, la parte de cada cuota que reduce la
  deuda. Es igual en todas las cuotas; el interés se cobra sobre lo que se
  sigue debiendo, por eso las cuotas bajan.
intereses_totales: >-
  Todo lo que se paga por encima del monto prestado durante la vida del
  crédito, sin seguros ni comisiones.
total_pagado: >-
  El monto prestado más todos los intereses.
proporcion_intereses: >-
  Cuánto suman los intereses frente al monto prestado.
tasa_convertida: >-
  La tasa del tipo pedido que cobra lo mismo que la tasa de la pregunta: con
  cualquiera de las dos se termina pagando igual en el año.
