# Series de tiempo externas: variable → geografía → id en la fuente.
# Ids de SUAMECA (Banco de la República), averiguados el 11/10/2026: el
# nacional en el catálogo del portal; las ciudades, en su gráfico de inflación
# por ciudad. Las ciudades empiezan en enero de 2017; el nacional, en 1954.
ipc:
  nombre: IPC              # en los supuestos: "Se usó el IPC nacional porque..."
  ids:
    nacional: 15000
    Bogotá: 15013
    Cali: 15014
    Medellín: 15015
    Barranquilla: 15016
    Armenia: 15017
    Bucaramanga: 15018
    Cartagena: 15019
    Cúcuta: 15020
    Florencia: 15021
    Ibagué: 15022
    Manizales: 15023
    Montería: 15024
    Neiva: 15025
    Pasto: 15026
    Pereira: 15027
    Popayán: 15028
    Riohacha: 15029
    Santa Marta: 15030
    Sincelejo: 15031
    Tunja: 15032
    Valledupar: 15033
    Villavicencio: 15034

# Tasas (12/10/2026): rama "Tasas de interés y sector financiero" del catálogo
# del portal. Solo nacionales y diarias; cada una en su unidad oficial.
tasa_politica:
  nombre: tasa de política monetaria     # efectiva anual, base 365; desde 1998
  ids:
    nacional: 59
ibr_3m:
  nombre: IBR a 3 meses                  # nominal, base 360; desde 2012
  ids:
    nacional: 243

# Panorama macro (13/10/2026): catálogo del portal (consultaMenuXopcion?opcion=
# CATALOGO_DATOS, código en enlace_pagina_externa). Solo nacionales.
trm:
  nombre: TRM                            # pesos por dólar, diaria; desde 1991
  ids:
    nacional: 1
pib:
  nombre: crecimiento del PIB            # variación anual del PIB real, trimestral, DANE
  ids:
    nacional: 15271
desempleo:
  nombre: tasa de desempleo              # mensual, DANE, sin ajuste estacional
  ids:
    nacional: 15312

# Proyectos (15/10/2026): ancla de largo plazo de la senda de inflación del
# flujo de caja (después del horizonte del Informe de Política Monetaria).
meta_inflacion:
  nombre: meta de inflación              # porcentaje anual, Banco de la República
  ids:
    nacional: 853

# Costo de capital (16/10/2026): tasa sin riesgo real del WACC. El TES en UVR
# paga sobre un valor que sigue al IPC, así que su tasa ya es real.
tes_uvr_10:
  nombre: TES cero cupón en UVR a 10 años   # tasa efectiva anual, diaria
  ids:
    nacional: 15277
